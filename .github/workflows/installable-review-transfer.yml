name: private-installable-review-transfer
on:
  push:
    branches: [feat/installable-distribution]
    paths:
      - '.github/maintenance/installable-review.*'
      - '.github/workflows/installable-review-transfer.yml'
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'fokhruli/BnTeX' && github.event.repository.private == true && github.ref == 'refs/heads/feat/installable-distribution'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply exact reviewed source fixes
        if: hashFiles('.github/maintenance/installable-review.py') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/maintenance/installable-review.py
