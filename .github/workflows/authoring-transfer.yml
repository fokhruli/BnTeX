name: private-authoring-transfer
on:
  push:
    branches: [feat/automatic-bengali-styles]
    paths: [.github/workflows/authoring-transfer.yml]
permissions:
  contents: write
jobs:
  exact-source-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply only the hash-verified tested source and remove transfer files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess, tempfile
          def git(*args, **kwargs):
              return subprocess.check_output(['git',*args], **kwargs).decode().strip()
          assert git('rev-parse','HEAD') == os.environ['EXPECTED_HEAD']
          assert git('rev-parse','HEAD^') == 'dbeab3c93d01004c0081493bacc6f5cc05912752'
          assert not git('status','--porcelain')
          names=[f'.github/maintenance/authoring-transfer-{i}.b64' for i in range(3)]
          encoded=b''.join(pathlib.Path(n).read_bytes() for n in names)
          assert hashlib.sha256(encoded).hexdigest() == '7e8dd5d51d900f18fd31166439bb92cdf4174dfb205048da5b10890a25c8299f'
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=256*1024*1024)
          assert len(patch)==93667
          assert hashlib.sha256(patch).hexdigest() == 'c0908c0f9b5eb1166a1af38d7b9fc4ac9762da4d4d709b0d2dda6aeb61a1fa79'
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch);f.flush()
              git('apply','--check',f.name)
              git('apply',f.name)
          git('rm','--',*names,'.github/workflows/authoring-transfer.yml')
          git('add','--all')
          tree=git('write-tree')
          assert tree == '24a85bd3837929e16fceacd02e43c32e4616dce0',tree
          git('config','user.name','BnTeX development automation')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat: automatic Bengali authoring, audited bold and declared slanted emphasis',
              '-m','Exact locally validated source tree. 807 tests passed with mandatory integration and oracle checks. No document vocabulary, runtime Python, font redistribution or publication. Remove temporary source-transfer workflow and payload from the final tree.')
          env=dict(os.environ)
          auth=base64.b64encode(('x-access-token:'+env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          remote=git('ls-remote','origin','refs/heads/feat/automatic-bengali-styles',env=env).split()[0]
          assert remote == os.environ['EXPECTED_HEAD'],'Branch changed; no overwrite attempted'
          subprocess.run(['git','push','origin','HEAD:refs/heads/feat/automatic-bengali-styles'],env=env,check=True)
          print('Validated source head:',git('rev-parse','HEAD'))
          print('Validated source tree:',tree)
          PY
