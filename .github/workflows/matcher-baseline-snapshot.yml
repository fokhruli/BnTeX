name: private-matcher-baseline
on:
  push:
    branches: [feat/native-matcher-specialization]
    paths: [.github/workflows/matcher-baseline-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'fokhruli/BnTeX' && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f6f8fa38a0092909204010d0bd36c707bb24e12
          persist-credentials: false
      - name: Archive tracked baseline only, without Git credentials or installed fonts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1f6f8fa38a0092909204010d0bd36c707bb24e12
          mkdir -p "$RUNNER_TEMP/matcher-source"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/matcher-source/tree.txt"
          if grep -Ei '\.(ttf|otf|woff2?|pfb|pfa)$' "$RUNNER_TEMP/matcher-source/tree.txt"; then exit 1; fi
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/matcher-source/baseline.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/matcher-source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: matcher-source-1f6f8fa
          path: ${{ runner.temp }}/matcher-source/
          retention-days: 3
          if-no-files-found: error
