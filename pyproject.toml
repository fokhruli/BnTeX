[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bntex-preparer"
version = "0.2.0a1"
description = "Build and test tools for BnTeX, native Bengali shaping for pdfLaTeX"
requires-python = ">=3.10"
dependencies = ["fonttools>=4.40"]
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "BnTeX contributors"}]

[project.optional-dependencies]
test = ["pytest>=7", "pypdf>=5,<7"]

[project.scripts]
bntex = "bntex.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bntex = ["data/*.sty", "data/*.def"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires TeX, HarfBuzz, and locally installed Bengali fonts"]
