[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bntex-preparer"
version = "0.1.0a2"
description = "Experimental cached Bengali shaping and native glyphs for pdfLaTeX"
requires-python = ">=3.10"
dependencies = ["fonttools>=4.40"]
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "BnTeX contributors"}]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bntex = "bntex.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bntex = ["data/*.sty"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires TeX, HarfBuzz, and locally installed Bengali fonts"]
